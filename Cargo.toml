[package]
categories = ["command-line-utilities"]
description = "A TUI to help you monitor resources and services on your TrueNas server."
edition = "2024"
include = ["CHANGELOG.md", "LICENSE", "README.md", "src/**", "themes/**"]
keywords = ["monitoring", "TrueNas", "tui"]
license = "AGPL-3.0-or-later"
name = "tntop"
repository = "https://aaronmallen.dev/aaron/tntop"
version = "0.1.0"

[dependencies]
anstream = "0.6"
anstyle = "1"
clap = { features = ["derive"], version = "4" }
compote = { features = ["env", "toml"], version = "0.3" }
dir_spec = "0.5"
futures-util = { features = ["sink"], version = "0.3" }
getset = "0.1"
keyring = { features = ["v1"], version = "4" }
log = { features = ["serde", "std"], version = "0.4" }
ratatui = { version = "0.30" }
ring = "0.17"
rustls = { default-features = false, features = [
  "ring",
  "std",
  "tls12",
], version = "0.23" }
rustls-native-certs = "0.8"
serde = { features = ["derive"], version = "1" }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
], version = "1" }
tokio-tungstenite = { features = ["rustls-tls-native-roots"], version = "0.30" }
toml_edit = "0.25"
typed-env = "0.3"
url = { features = ["serde"], version = "2" }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"

[dev-dependencies]
pretty_assertions = "1"
rcgen = "0.14"
tokio-rustls = { default-features = false, features = [
  "ring",
  "tls12",
], version = "0.26" }
