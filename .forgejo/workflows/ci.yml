name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ""
  MISE_SKILLS_FETCH: "false"
  MISE_SKILLS_AUTO_SYNC: "false"

jobs:
  check:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: https://github.com/actions/checkout@v7
        with:
          fetch_depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: https://github.com/jdx/mise-action@v5
        with:
          cache: false
          github_token: ""
      - name: Lint
        run: mise run lint
      - name: Check
        run: mise run check
      - name: Test
        run: mise run test
      - name: Build
        run: mise run build
